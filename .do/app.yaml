name: coworking
region: blr
services:
  - name: co-working-space
    github:
      repo: Shivammishra0001/data-science--co-working-
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    health_check:
      http_path: /healthz
